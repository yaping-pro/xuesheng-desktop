name: Build and Release Universal DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS Universal DMG
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Rust 工具链及多架构 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 恢复 Cargo 编译缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: macos-cargo-universal-${{ hashFiles('app.json') }}
          restore-keys: |
            macos-cargo-universal-

      - name: 全局安装 Pake CLI
        run: npm install -g pake-cli

      - name: 声明式打包 Universal DMG
        run: |
          echo "Starting Pake build from app.json..."
          pake --config app.json --multi-arch --targets universal --json

      - name: 归档本地构建产物
        uses: actions/upload-artifact@v4
        with:
          name: XueSheng-Universal-DMG
          path: "*.dmg"
          retention-days: 14

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: "*.dmg"
          name: Release ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
