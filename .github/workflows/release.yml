name: Build and Release Multi-Platform Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS (Universal)
            os: macos-14
            args: --multi-arch --targets universal
          - name: Windows (x64)
            os: windows-latest
            args: --targets x64
          - name: Linux (deb, appimage)
            os: ubuntu-22.04
            args: --targets deb,appimage

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: 全局安装 Pake CLI
        run: npm install -g pake-cli

      - name: 声明式打包
        shell: bash
        run: |
          echo "Starting Pake build with args: ${{ matrix.platform.args }}"
          pake --config app.json ${{ matrix.platform.args }} --json

      - name: 发布产物至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            *.dmg
            *.msi
            *.deb
            *.AppImage
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Release ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
